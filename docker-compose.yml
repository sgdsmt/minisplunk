version: "3.8"

services:

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    hostname: rabbitmq

    environment:
      RABBITMQ_DEFAULT_USER: rabbituser
      RABBITMQ_DEFAULT_PASS: rabbit1234

    ports:
      - "5672:5672"
      - "15672:15672"

  gateway:
    build: ./gateway
    container_name: gateway

    depends_on:
      - rabbitmq

    ports:
      - "8000:8000"

    restart: unless-stopped
